name: Cardiogram
description: Cardiogram is a digital-health company whose consumer app analyzes heart-rate and
  activity data from wearables such as the Apple Watch, Wear OS, Garmin, and Fitbit to help people
  understand their cardiovascular health. Its DeepHeart deep-neural-network technology was developed
  to screen heart-rate patterns for signs of conditions including atrial fibrillation, sleep apnea,
  diabetes, and hypertension, work studied in collaboration with academic health researchers. The
  company is backed by Andreessen Horowitz (a16z). This profile was added to the API Evangelist
  network as a venture-portfolio lead; as of this pass Cardiogram exposes no public developer or API
  surface and its primary website (cardiogram.com) does not complete an HTTPS/TLS handshake.
